[build-system]
requires = ["uv>=0.4"]
build-backend = "uv.backends.python"

[project]
name = "deskflow-backend"
version = "0.1.0"
description = "Backend for DeskFlow - Workspace reservation system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project]
dependencies = [
    "fastapi>=0.115.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "pydantic>=2.0.0",
    "qrcode>=7.0",
    "pillow>=10.0",
    "python-jwt>=3.0",
    "uvicorn[standard]>=0.30.0",
    "apscheduler>=3.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.10",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/openrouter/free"
Documentation = "https://deskflow.github.io/"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
