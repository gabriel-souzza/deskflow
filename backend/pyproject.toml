[build-system]
requires = ["uv>=0.4"]
build-backend = "uv.backends.python"

[project]
name = "deskflow-backend"
version = "0.1.0"
description = "Backend for DeskFlow - Workspace reservation system"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.10",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/openrouter/free"
Documentation = "https://deskflow.github.io/"

[tool.uv]
cache = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
