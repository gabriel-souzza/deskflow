services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    command: [ "sh", "-c", "alembic -c src/infra/migrations/alembic.ini upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000" ]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/deskflow
      - SECRET_KEY=${SECRET_KEY:-deskflow-dev-secret}
      - JWT_SECRET=${JWT_SECRET:-deskflow-dev-secret-key-2026-longer-than-32}
      - SSE_HEARTBEAT_INTERVAL=30
      - CHECKIN_TOLERANCE_MINUTES=10
      - CANCELLATION_MINIMUM_HOURS=2
      - SLOT_DURATION_MINUTES=15
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@deskflow.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-deskflow-dev-pgadmin}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  pgadmin_data:
