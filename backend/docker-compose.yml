version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/deskflow
      - SECRET_KEY=${SECRET_KEY:-deskflow-dev-secret}
      - JWT_SECRET=${JWT_SECRET:-deskflow-dev-secret-key-2026-longer-than-32}
      - SSE_HEARTBEAT_INTERVAL=30
      - CHECKIN_TOLERANCE_MINUTES=10
      - CANCELLATION_MINIMUM_HOURS=2
      - SLOT_DURATION_MINUTES=15
    depends_on:
      - db
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: deskflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
