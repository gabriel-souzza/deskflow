[alembic]
script_location = src/infra/migrations
prepend_sys_path = src
version_path_separator = os
sqlalchemy.url = postgresql+asyncpg://postgres:postgres@db:5432/deskflow

[post_write_hooks]
# post_write_hooks defines post-run hooks.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S