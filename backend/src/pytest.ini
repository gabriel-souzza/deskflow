[pytest]
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov=src --cov-report=term-missing --cov-fail-under=55
markers =
    slow: slow tests (deselect with '-m "not slow"')
    integration: requires PostgreSQL (testcontainers)
    domain: pure domain tests (fast)
