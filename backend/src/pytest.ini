[pytest]
testpaths = src/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers --cov-config=.coveragerc --cov=src/adapters/controllers --cov=src/adapters/events --cov=src/adapters/repositories --cov=src/application --cov=src/domain/entities --cov=src/domain/value_objects --cov=src/infra --cov=main --cov-report=term-missing --cov-fail-under=80
markers =
    slow: slow tests (deselect with '-m "not slow"')
    integration: requires PostgreSQL (testcontainers)
    domain: pure domain tests (fast)
