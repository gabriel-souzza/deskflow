name: DeskFlow CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deskflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --project . --all-extras --dev
      - name: Run migrations
        working-directory: ./backend
        run: uv run --project . alembic -c src/infra/migrations/alembic.ini upgrade head
      - name: Run tests
        working-directory: ./backend
        run: uv run --project . pytest src/tests/domain src/tests/application -v --cov=src --cov-fail-under=80 --cov-report=term