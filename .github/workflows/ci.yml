name: DeskFlow CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: deskflow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Install dependencies
        working-directory: ./backend
        run: uv sync --project . --all-extras --dev
      - name: Run migrations
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deskflow
        run: uv run --project . alembic -c src/infra/migrations/alembic.ini upgrade head
      - name: Run lint and typecheck
        working-directory: ./backend
        run: |
          uv run --project . ruff check src/domain src/application src/adapters src/infra
          uv run --project . mypy src/domain src/application
      - name: Run tests
        working-directory: ./backend
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deskflow
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/deskflow
        run: uv run --project . pytest src/tests/domain src/tests/application src/tests/adapters src/tests/integration -v --cov=src --cov-fail-under=80 --cov-report=term